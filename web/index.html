<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2UI Tutor — Answers you can press</title>
    <meta
      name="description"
      content="An interactive coding tutor that answers with A2UI surfaces: quizzes, line-level code blocks and output predictors. One approved catalog, no accounts, your own model key."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>document.documentElement.classList.add('js')</script>
    <style>
      .nojs { max-width: 1280px; margin: 0 auto; padding: 96px 40px; font-family: "Geist", system-ui, sans-serif; color: #151515; }
      .nojs__eyebrow, .nojs__meta { font-family: "Geist Mono", monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #666666; }
      .nojs__title { font-size: 40px; line-height: 44px; letter-spacing: -1.5px; font-weight: 500; margin: 20px 0; max-width: 820px; }
      .nojs__body { max-width: 56ch; color: #525252; margin: 0 0 32px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="nojs">
        <p class="nojs__eyebrow">A2UI Tutor</p>
        <p class="nojs__title">Answers you can press.</p>
        <p class="nojs__body">
          The session needs JavaScript: the surfaces, the feed and the composer are all drawn in the browser. Turn it on
          and reload to start.
        </p>
        <p class="nojs__meta">Five approved components · One JSON catalog · No accounts</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
