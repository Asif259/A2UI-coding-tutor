<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — A2UI Tutor</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ededed; --strong: #151515; --muted: #666666;
      --line: #15151529; --font: "Geist", system-ui, sans-serif; --font-ui: "Geist Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--strong); font: 400 15px/22px var(--font); }
    .nf { min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; max-width: 1280px; margin-inline: auto; }
    .nf__body { display: flex; flex-direction: column; gap: 20px; max-width: 640px; }
    .nf__code { font-family: var(--font-ui); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    h1 { font-weight: 500; font-size: 40px; line-height: 44px; letter-spacing: -1.5px; margin: 0; text-wrap: balance; }
    p { margin: 0; color: var(--muted); }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    a.btn { display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 8px; text-decoration: none; font-family: var(--font-ui); font-size: 13px; }
    .primary { background: var(--strong); color: #ededed; }
    .secondary { border: 1px solid var(--line); color: var(--strong); }
    .logo { font-family: var(--font-ui); font-size: 13px; letter-spacing: .12em; color: var(--strong); text-decoration: none; }
    footer { font-family: var(--font-ui); font-size: 11px; color: var(--muted); padding-top: 40px; border-top: 1px solid var(--line); }
    a:focus-visible { outline: 2px solid var(--strong); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="nf">
    <a class="logo" href="/">A2UI TUTOR</a>
    <div class="nf__body">
      <span class="nf__code">Error 404</span>
      <h1 class="h2">This page has moved, or never existed.</h1>
      <p>Check the address, or start again from the session.</p>
      <div class="btns">
        <a class="btn primary" href="/">Back to home</a>
        <a class="btn secondary" href="/#questions">Read the questions</a>
      </div>
    </div>
    <footer>© 2026 A2UI Tutor</footer>
  </main>
</body>
</html>
