[project]
name = "a2ui-tutor-agent"
version = "0.1.0"
description = "Interactive coding tutor agent that answers in A2UI v1.0 surfaces."
requires-python = ">=3.11"
dependencies = [
  "a2ui-agent-sdk>=0.12,<0.13",
  "a2ui-core>=0.7,<0.8",
  "google-genai>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
